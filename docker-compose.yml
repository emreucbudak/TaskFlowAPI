services:
  taskflow.presentation:
    image: ${DOCKER_REGISTRY-}taskflowpresentation
    build:
      context: .
      dockerfile: src/Taskflow.API/Taskflow.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Postgres__Host=postgres
      - Postgres__Port=5432
      - Postgres__Database=TaskFlowDb
      - Redis__Host=redis
      - Redis__Port=6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__ExchangeName=taskflow.exchange
    secrets:
      - postgres_user
      - postgres_password
      - rabbitmq_user
      - rabbitmq_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=TaskFlowDb
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d TaskFlowDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - taskflow-redis-data:/data
    secrets:
      - redis_password
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$(cat /run/secrets/redis_password)\""]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    command:
      - sh
      - -ec
      - |
          cat > /etc/rabbitmq/rabbitmq.conf <<EOF
          default_user = $(cat /run/secrets/rabbitmq_user)
          default_pass = $(cat /run/secrets/rabbitmq_password)
          default_vhost = /
          EOF
          exec rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - taskflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  taskflow-postgres-data:
  taskflow-redis-data:
  taskflow-rabbitmq-data:

secrets:
  postgres_user:
    environment: TF_POSTGRES_USER
  postgres_password:
    environment: TF_POSTGRES_PASSWORD
  rabbitmq_user:
    environment: TF_RABBITMQ_USER
  rabbitmq_password:
    environment: TF_RABBITMQ_PASSWORD
  redis_password:
    environment: TF_REDIS_PASSWORD
